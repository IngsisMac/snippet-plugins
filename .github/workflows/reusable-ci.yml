name: Reusable CI Workflow

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '21'
      distribution:
        required: false
        type: string
        default: 'temurin'
    secrets:
      PACKAGES_TOKEN:
        description: 'Token con read:packages para bajar snippet-plugins y el jar de printscript. Si no se pasa, se usa el GITHUB_TOKEN del repo.'
        required: false

jobs:
  build-and-verify:
    name: Build, Quality & Test Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Spotless Format Check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Detekt Static Analysis
        run: ./gradlew detekt --no-daemon

      - name: Test & JaCoCo Coverage Verification (>=80%)
        run: ./gradlew test jacocoTestCoverageVerification --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          if-no-files-found: ignore
