name: Reusable CD Workflow

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile-path:
        required: false
        type: string
        default: 'Dockerfile'
      context-path:
        required: false
        type: string
        default: '.'
    secrets:
      GHCR_TOKEN:
        required: false
      INFRA_DISPATCH_TOKEN:
        required: false

jobs:
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew bootJar --no-daemon -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context-path }}
          file: ${{ inputs.dockerfile-path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El contexto `secrets` no existe en el `if` de un paso, asi que la presencia del token
      # se chequea adentro del script: si lo condicionara en el `if`, la comparacion daria
      # siempre falso y el aviso a snippet-infra no saldria nunca, en silencio.
      - name: Trigger snippet-infra deployment
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN || secrets.GHCR_TOKEN }}
          TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          TAG_VAL: ${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=Deploy not triggered::Neither INFRA_DISPATCH_TOKEN nor GHCR_TOKEN is set, so snippet-infra was not notified. The image was pushed to GHCR but nothing will deploy it: run the deploy workflow in snippet-infra by hand."
            exit 0
          fi
          echo "Notifying snippet-infra to deploy stack for environment $TARGET_ENV..."
          code=$(curl -s -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$OWNER/snippet-infra/dispatches" \
            -d "{\"event_type\": \"deploy-stack\", \"client_payload\": {\"environment\": \"$TARGET_ENV\", \"tag\": \"$TAG_VAL\"}}")
          if [ "$code" = "204" ]; then
            echo "snippet-infra notified (HTTP 204)."
          else
            echo "::warning title=Deploy not triggered::The repository_dispatch to snippet-infra answered HTTP $code instead of 204. A 404 usually means the token cannot see snippet-infra or lacks the 'contents: write' scope; a 401 means it is invalid or expired."
            cat /tmp/dispatch.out || true
          fi
